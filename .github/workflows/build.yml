name: SonarCloud
on:
  push:
    branches:
      - main # or the name of your main branch
  pull_request:
    types: [opened, synchronize, reopened]
  # schedule:
  #  - cron: '17 0 * * 4'
jobs:
  scan:
    runs-on: ubuntu-latest
    #strategy:
    #  matrix:
    #    python-version: [2.7, 3.5, 3.6, 3.7, 3.8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          sudo apt update
          sudo apt install ffmpeg libimage-exiftool-perl
      #- name: Lint with flake8
      #  run: |
      #    stop the build if there are Python syntax errors or undefined names
      #    flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      #    exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
      #    flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      # - name: Test with pytest
      #     run: |
      #       pytest
      - name: Run tests
        run: |
          mkdir -p build
          coverage run -m pytest --junitxml=build/ut.xml
      - name: Coverage report
        if: success() || failure()
        run: |
          coverage xml -o build/coverage.xml
      - name: Run ruff
        if: success() || failure()
        run: |
          mkdir -p build
          # ruff reports the issues with its exit code: the issues are reported to SonarCloud, they don't fail the build
          ruff check --output-format=concise . | tee build/ruff-report.txt | python ruff2sonar.py > build/ruff-report.json || true
      - name: Run pylint
        if: success() || failure()
        run: |
          pylint --rcfile conf/pylintrc *.py */*.py -r n --msg-template="{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}" | tee build/pylint-report.out || true
      - name: Run flake8
        if: success() || failure()
        run: |
          flake8 --ignore=W503,E128,C901,W504,E302,E265,E741,W291,W293,W391,F401,E722 --max-line-length=150 . > build/flake8-report.out || true
      - name: Run bandit
        if: success() || failure()
        run: |
          bandit --exit-zero -f json --skip B311,B303,B101 -r . -x .vscode,./tests > build/bandit-report.json
      - name: Get project version
        id: project-version
        if: success() || failure()
        run: |
          # The version of the project is the one of pyproject.toml
          version=$(grep -m1 '^version' pyproject.toml | sed -E 's/^version *= *"([^"]+)".*/\1/' | tr -d '\r\n')
          if [ -z "$version" ]; then
            echo "Can't find the project version in pyproject.toml"
            exit 1
          fi
          echo "Project version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache SonarQube packages
        if: success() || failure()
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Cloud scan
        if: success() || failure()
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.verbose=false
            -Dsonar.projectVersion=${{ steps.project-version.outputs.version }}


